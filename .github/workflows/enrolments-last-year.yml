name: Collect last year's final enrolments

# Run this by hand (Actions tab > Run workflow). It reads last year's course pages once and saves each
# course's final numbers in PD/enrolments/data/last-year.json, for the reference line on the charts.
on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to read (the year before the one being collected now)'
        required: true
        default: '2026'

permissions:
  contents: write

concurrency:
  group: enrolments
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --prefix PD/enrolments/scraper --no-audit --no-fund
      - name: Collect last year's final numbers
        run: node PD/enrolments/scraper/scrape.mjs
        env:
          MODE: lastyear
          YEAR: ${{ github.event.inputs.year }}
      - name: Save the data
        run: |
          git config user.name "enrolments-bot"
          git config user.email "enrolments-bot@users.noreply.github.com"
          git add PD/enrolments/data/last-year.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update last year's final enrolments"
          for i in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" && git push && exit 0
            sleep 5
          done
          exit 1
