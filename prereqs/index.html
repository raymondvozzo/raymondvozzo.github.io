<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Prerequisite Tree</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root{--navy:#140f50;--purple:#8C78FF;--dpurple:#6E5AE1;--bblue:#1448FF;--lime:#F8EFE0;--up:#F5A300;--down:#0E9F9A;
--head:"National 2 Condensed","National 2","Arial Narrow","Roboto Condensed",Arial,sans-serif;--body:Georgia,"Roboto Serif",Cambria,serif;--ui:Arial,Helvetica,sans-serif}
*{box-sizing:border-box}
body{font-family:var(--ui);margin:0;padding:28px;background:var(--navy);color:#fff;min-height:100vh}
.wrap{max-width:1400px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{margin:0 0 10px;font-size:15px;font-weight:700;color:#fff}
h1{font-family:var(--head);font-weight:700;font-size:clamp(2.6rem,6vw,4.2rem);line-height:.9;letter-spacing:-.01em;margin:0 0 14px;color:#fff}
h1 em{font-style:normal;color:var(--purple)}
.subtitle{font-family:var(--body);margin:0;max-width:640px;line-height:1.5;color:#fff}
.majors{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:14px 16px;min-width:250px}
.majors h2{font-family:var(--head);font-size:1.15rem;margin:0 0 8px;color:#fff}
.majors ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pill{border-radius:6px;padding:5px 10px;font-size:13px;font-weight:700;background:var(--f);color:var(--t);border:2px solid var(--s)}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.controls input{padding:10px 18px;border:2px solid transparent;border-radius:25px;font-size:14px;width:260px;font-family:var(--ui)}
.controls input:focus,button:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
button{background:var(--bblue);color:#fff;border:none;padding:11px 22px;border-radius:25px;cursor:pointer;font-size:14px;font-weight:700;font-family:var(--ui)}
button:hover{filter:brightness(1.15)}
#viz{width:100%;max-height:85vh;border-radius:14px;background:#fff;overflow:auto;box-shadow:0 20px 40px rgba(0,0,0,.35)}
svg{display:block;min-width:900px;width:100%;height:auto}
.pure{--f:#6E5AE1;--s:#4B3BB0;--t:#fff}
.applied{--f:#1448FF;--s:#0A2FC7;--t:#fff}
.statistics{--f:#140f50;--s:#05031F;--t:#fff}
.core{--f:#F8EFE0;--s:#140f50;--t:#140f50}
.discipline{--f:#B5338A;--s:#7E1F61;--t:#fff}
.node{cursor:pointer;outline:none;transition:opacity .25s}
.node rect{fill:var(--f);stroke:var(--s);stroke-width:2}
.node.off{opacity:.5}
.node.off rect{stroke-dasharray:5 3}
.node:hover rect,.node:focus rect{filter:brightness(1.12)}
.node:focus rect{stroke:var(--up);stroke-width:4}
.node.up rect{stroke:var(--up);stroke-width:4}
.node.down rect{stroke:var(--down);stroke-width:4}
.node.sel rect{stroke:#000;stroke-width:5;filter:drop-shadow(0 0 5px rgba(20,15,80,.7))}
.node.faded{opacity:.12}
.node text{fill:var(--t);text-anchor:middle;pointer-events:none;font-size:9.5px;font-family:var(--ui)}
.node text.code{font-size:11px;font-weight:700}
.node .badge circle{fill:#fff;stroke:var(--navy);stroke-width:1}
.node .badge text{fill:var(--navy);font-weight:700;font-size:10px}
.year-label{font-family:var(--head);font-size:24px;font-weight:700;fill:var(--navy);text-anchor:middle}
.link{fill:none;stroke:#9a97b8;stroke-width:1.8;marker-end:url(#arrow);transition:opacity .25s}
.link.alt{stroke-dasharray:6 4}
.link.up{stroke:var(--up);stroke-width:3;marker-end:url(#arrow-up)}
.link.down{stroke:var(--down);stroke-width:3;marker-end:url(#arrow-down)}
.link.faded{opacity:.05}
#panel{position:fixed;right:20px;bottom:20px;width:320px;max-height:60vh;overflow:auto;background:#fff;color:var(--navy);border-radius:12px;border-left:8px solid var(--dpurple);padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.4);display:none;z-index:10;font-family:var(--body);font-size:14px;line-height:1.45}
#panel h3{font-family:var(--head);font-size:1.5rem;line-height:1;margin:0 0 8px;color:var(--navy)}
#panel .code{color:var(--dpurple);font-family:var(--ui)}
#panel .x{position:absolute;top:6px;right:8px;background:none;color:var(--navy);padding:2px 8px;font-size:20px}
#panel p{margin:8px 0 0}
.warn{color:#9c3d00}
.legend{margin-top:18px;padding:14px;border:1px solid rgba(255,255,255,.25);border-radius:10px;font-size:12px;color:#fff}
.legend span.item{display:inline-block;margin:5px 14px}
.sw{display:inline-block;width:20px;height:14px;margin-right:6px;border-radius:3px;vertical-align:middle;background:var(--f);border:2px solid var(--s)}
.ln{display:inline-block;width:26px;margin-right:6px;vertical-align:middle;border-top:3px solid #9a97b8}
@media(max-width:600px){#panel{left:10px;right:10px;width:auto}body{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
<div>
<p class="eyebrow">School of Mathematical Sciences · Adelaide University</p>
<h1>Course prerequisite tree</h1>
<p class="subtitle" id="sub"></p>
</div>
<aside class="majors" aria-label="Major colour key"><h2>Majors</h2><ul id="majors"></ul></aside>
</header>
<div class="controls">
<input id="q" type="search" placeholder="Search code or name…" aria-label="Search courses">
<button onclick="resetView()">Reset view</button>
</div>
<div id="viz"></div>
<div class="legend">
<span class="item"><span class="sw core" style="opacity:.5;border-style:dashed"></span>Not currently offered</span>
<span class="item"><span class="ln"></span>Required prerequisite</span>
<span class="item"><span class="ln" style="border-top-style:dashed"></span>One of several alternatives</span>
<span class="item"><span class="ln" style="border-color:#F5A300"></span>Leads to selected course</span>
<span class="item"><span class="ln" style="border-color:#0E9F9A"></span>Unlocked by selected course</span>
<span class="item"><b>ⓘ</b> = other entry requirement (see details)</span>
</div>
<div id="panel" role="dialog" aria-label="Course details"></div>
</div>
<script>

function okCol(v){if(v===undefined)throw new Error('courses.csv has no "offered" column (the browser may be showing an old copy of the file)');return v}
function parseCSV(t){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"')q=true;
    else if(c===','){row.push(cur);cur='';}
    else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
    else if(c!=='\r')cur+=c;}
  if(cur||row.length){row.push(cur);rows.push(row);}
  const h=rows.shift().map(s=>s.trim());
  return rows.filter(r=>r.some(x=>x.trim())).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()])));
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Prerequisite expressions: parse AND/OR so we know which links are alternatives
const CODE=/[A-Z]{3,5}[0-9]{3,4}/g;
function parseExpr(s){
  const tk=s.match(/\(|\)|AND|OR|[A-Z]{3,5}[0-9]{3,4}/g)||[];let p=0;
  const atom=()=>{const t=tk[p++];if(t==='('){const n=or();p++;return n;}return{code:t};};
  const and=()=>{const k=[atom()];while(tk[p]==='AND'){p++;k.push(atom());}return k.length>1?{op:'and',k}:k[0];};
  const or=()=>{const k=[and()];while(tk[p]==='OR'){p++;k.push(and());}return k.length>1?{op:'or',k}:k[0];};
  return tk.length?or():null;
}
// Which prerequisite courses are shown as solid (required) rather than dashed (alternatives)?
// The expression is expanded into branches (sets of courses needed together). Branches that need a course
// outside the tree are ignored when an all-in-tree branch exists. With one branch left, all its courses are
// solid. With several, courses in every branch are solid, and so is the single multi-course branch,
// e.g. "(A AND B) OR C" gives A and B solid and C dashed.
function branches(n){if(n.code)return[[n.code]];if(n.op==='or')return n.k.flatMap(branches);
 return n.k.reduce((acc,k)=>acc.flatMap(a=>branches(k).map(b=>[...new Set([...a,...b])])),[[]])}
function solidSet(n,inTree){const out=new Set();if(!n)return out;
 let B=branches(n);const full=B.filter(b=>b.every(inTree));
 B=full.length?full:B.map(b=>b.filter(inTree)).filter(b=>b.length);
 if(!B.length)return out;
 if(B.length===1){B[0].forEach(c=>out.add(c));return out}
 B[0].filter(c=>B.every(b=>b.includes(c))).forEach(c=>out.add(c));
 const multi=B.filter(b=>b.length>1);if(multi.length===1)multi[0].forEach(c=>out.add(c));
 return out}
function collectRequired(n,r,out){
  if(!n)return;
  if(n.code){if(r)out.add(n.code);return;}
  n.k.forEach(c=>collectRequired(c,r&&n.op==='and',out));
}

fetch('courses.csv').then(r=>{if(!r.ok)throw new Error('courses.csv not found (HTTP '+r.status+')');return r.text()}).then(csv=>{
const courses=parseCSV(csv).map(r=>({
  code:r['Course Code'],name:r['Course Name'],level:+r.level,
  sem:r.semester.replace(/\s/g,'').replace(',',' & '),
  raw:r['Prerequisite course(s)'],note:r['Prerequisite note(s)'],
  major:r.major||'core',off:okCol(r.offered).toLowerCase()==='y'}));
const byCode=new Map(courses.map(c=>[c.code,c]));
const links=[];
courses.forEach(c=>{
  const all=[...new Set(c.raw.match(CODE)||[])];
  const req=solidSet(parseExpr(c.raw),x=>byCode.has(x));
  c.external=all.filter(x=>!byCode.has(x));
  c.rule=!!c.note&&/units|grade/i.test(c.note)&&!all.some(x=>byCode.has(x));
  all.filter(x=>byCode.has(x)).forEach(x=>links.push({source:x,target:c.code,alt:!req.has(x)}));
});
document.getElementById('sub').textContent=
  `${courses.filter(c=>c.off).length} of ${courses.length} courses currently offered · click a course (or press Enter) to see what leads to it and what it unlocks`;

// Layout: columns by level; within a major sort by name, not-offered last
const MAJORS={core:{label:'Core'},applied:{label:'Applied Mathematics'},pure:{label:'Pure Mathematics'},statistics:{label:'Statistics/Data Science'},discipline:{label:'Discipline Electives'}};
const ORDER=Object.keys(MAJORS);
d3.select('#majors').selectAll('li').data(ORDER).join('li').attr('class',m=>'pill '+m).text(m=>MAJORS[m].label);
const semRank=c=>c.sem==='1'?1:c.sem==='2'?2:3; // Sem 1, then Sem 2, then offered in both
// Bespoke ordering tweaks: pin some courses to the top of their group, swap others
const PIN_TOP=['MATH1004','MATH1005','MATHX203']; // Calculus 1, Calculus 2, Multivariable Calculus
const SWAP=[['MATH3900','MATH3902']];             // Mathematics Clinic 2 <-> Professional Practice
function tweak(g){
  PIN_TOP.slice().reverse().forEach(code=>{const i=g.findIndex(c=>c.code===code);if(i>0)g.unshift(g.splice(i,1)[0]);});
  SWAP.forEach(([x,y])=>{const i=g.findIndex(c=>c.code===x),j=g.findIndex(c=>c.code===y);if(i>=0&&j>=0)[g[i],g[j]]=[g[j],g[i]];});
  return g;
}
const NW=150,NH=54,GAP=6,SEP=18,COLW=310,TOP=60,LEFT=40;
const nodes=[];let maxH=0;
[1,2,3,4].forEach(l=>{
  let y=TOP,first=true;
  ORDER.forEach(m=>{
    const g=tweak(courses.filter(c=>c.level===l&&c.major===m).sort((a,b)=>(b.off-a.off)||(semRank(a)-semRank(b))||a.name.localeCompare(b.name)));
    if(!g.length)return;
    if(!first)y+=SEP;first=false;
    g.forEach(c=>{nodes.push({...c,x:LEFT+(l-1)*COLW,y});y+=NH+GAP;});
  });
  maxH=Math.max(maxH,y);
});
const W=LEFT*2+3*COLW+NW,H=maxH+30;
const pos=new Map(nodes.map(n=>[n.code,n]));

const svg=d3.select('#viz').append('svg').attr('viewBox',`0 0 ${W} ${H}`);
const defs=svg.append('defs');
[['arrow','#9a97b8'],['arrow-up','#F5A300'],['arrow-down','#0E9F9A']].forEach(([id,col])=>
  defs.append('marker').attr('id',id).attr('viewBox','0 -5 10 10').attr('refX',10)
    .attr('markerWidth',6).attr('markerHeight',6).attr('orient','auto')
    .append('path').attr('d','M0,-5L10,0L0,5').attr('fill',col));
[1,2,3,4].forEach(l=>svg.append('text').attr('class','year-label').attr('x',LEFT+(l-1)*COLW+NW/2).attr('y',32).text('Level '+l));

function linkPath(l){
  const s=pos.get(l.source),t=pos.get(l.target),sy=s.y+NH/2,ty=t.y+NH/2,RUN=18; // final straight run under the arrowhead
  if(s.level===t.level){ // same column: loop out along the right-hand side
    const x=s.x+NW,b=RUN+8+Math.min(Math.abs(ty-sy)/6,50);
    return `M${x},${sy} C${x+b},${sy} ${x+b},${ty} ${x+RUN},${ty} L${x},${ty}`;
  }
  const sx=s.x+NW,tx=t.x-RUN,m=(sx+tx)/2;
  return `M${sx},${sy} C${m},${sy} ${m},${ty} ${tx},${ty} L${t.x},${ty}`;
}
const linkSel=svg.append('g').selectAll('path').data(links).join('path')
  .attr('class',l=>'link'+(l.alt?' alt':'')).attr('d',linkPath);

const wrap=(txt,max)=>{
  const out=[];let line='';
  txt.split(' ').forEach(w=>{if((line+' '+w).trim().length>max&&line){out.push(line);line=w;}else line=(line+' '+w).trim();});
  out.push(line);
  if(out.length>2){out.length=2;out[1]=out[1].replace(/.{0,2}$/,'')+'…';}
  return out;
};
const nodeSel=svg.append('g').selectAll('g').data(nodes).join('g')
  .attr('class',d=>`node ${d.major}${d.off?'':' off'}`)
  .attr('transform',d=>`translate(${d.x},${d.y})`)
  .attr('tabindex',0).attr('role','button')
  .attr('aria-label',d=>`${d.code} ${d.name}${d.off?'':', not currently offered'}`)
  .on('click',(e,d)=>{e.stopPropagation();select(d);})
  .on('keydown',(e,d)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(d);}});
nodeSel.append('title').text(d=>`${d.code}: ${d.name}${d.off?'':' (not currently offered)'}`);
nodeSel.append('rect').attr('width',NW).attr('height',NH).attr('rx',6).attr('ry',6);
nodeSel.append('text').attr('class','code').attr('x',NW/2).attr('y',18).text(d=>d.code);
nodeSel.each(function(d){
  wrap(d.name,27).forEach((ln,i)=>d3.select(this).append('text').attr('x',NW/2).attr('y',32+i*11).text(ln));
});
const badge=nodeSel.filter(d=>d.rule).append('g').attr('class','badge');
badge.append('circle').attr('cx',NW-11).attr('cy',11).attr('r',8);
badge.append('text').attr('x',NW-11).attr('y',14.5).text('i');

// Selection: walk ancestors (up) and descendants (down) with visited sets
function walk(code,dir){
  const seen=new Set(),stack=[code];
  while(stack.length){
    const c=stack.pop();
    links.forEach(l=>{
      const from=dir==='up'?l.target:l.source,to=dir==='up'?l.source:l.target;
      if(from===c&&!seen.has(to)){seen.add(to);stack.push(to);}
    });
  }
  return seen;
}
function select(d){
  const up=walk(d.code,'up'),down=walk(d.code,'down');
  const rel=new Set([d.code,...up,...down]);
  const isUp=l=>up.has(l.source)&&(up.has(l.target)||l.target===d.code);
  const isDown=l=>down.has(l.target)&&(down.has(l.source)||l.source===d.code);
  nodeSel.classed('sel',n=>n.code===d.code).classed('up',n=>up.has(n.code))
    .classed('down',n=>down.has(n.code)).classed('faded',n=>!rel.has(n.code));
  linkSel.classed('up',isUp).classed('down',isDown).classed('faded',l=>!isUp(l)&&!isDown(l));
  showPanel(d,up.size,down.size);
  document.getElementById('q').value='';
}
function showPanel(d,nUp,nDown){
  const p=document.getElementById('panel');
  p.innerHTML=`<button class="x" onclick="resetView()" aria-label="Close">×</button>
    <h3><span class="code">${esc(d.code)}</span><br>${esc(d.name)}</h3>
    <div><b>Level ${d.level}</b> · Semester ${esc(d.sem)} · ${esc((MAJORS[d.major]||{label:d.major}).label)}</div>
    <div>${d.off?'Currently offered':'<b class="warn">Not currently offered</b>'}</div>
    <p><b>Prerequisites:</b> ${esc(d.raw||'None listed')}</p>
    ${d.note?`<p><b>Notes:</b> ${esc(d.note)}</p>`:''}
    ${d.external.length?`<p class="warn">Not in this course list (not drawn): ${esc(d.external.join(', '))}</p>`:''}
    <p>${nUp} course${nUp===1?'':'s'} lead to this one; it unlocks ${nDown}.</p>`;
  p.style.display='block';
}
function resetView(){
  nodeSel.classed('sel up down faded',false);
  linkSel.classed('up down faded',false);
  document.getElementById('panel').style.display='none';
}
window.resetView=resetView;
svg.on('click',resetView);
document.addEventListener('keydown',e=>{if(e.key==='Escape')resetView();});
document.getElementById('q').addEventListener('input',e=>{
  resetView();
  const q=e.target.value.trim().toLowerCase();
  if(q)nodeSel.classed('faded',n=>!(n.code+' '+n.name).toLowerCase().includes(q));
});
}).catch(e=>{document.getElementById('viz').innerHTML='<p style="padding:20px;color:#140f50">Could not load the course data: '+esc(e&&e.message||'download failed')+'. If you opened this file from your computer, open it from the website instead.</p>';console.error(e)});
</script>
</body>
</html>
