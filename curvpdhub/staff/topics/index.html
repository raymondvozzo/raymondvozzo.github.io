<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modules and topics</title>
<style>
:root{--navy:#140f50;--purple:#6E5AE1;--lpurple:#8C78FF;--bblue:#1448FF;--amber:#F5A300;--teal:#0E9F9A;--line:#d9d6ee;--ui:Arial,Helvetica,sans-serif;--body:Georgia,"Roboto Serif",Cambria,serif;--head:"National 2 Condensed","National 2","Arial Narrow","Roboto Condensed",Arial,sans-serif}
*{box-sizing:border-box}
body{font-family:var(--ui);margin:0;padding:28px;background:var(--navy);color:#fff;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto}
.eyebrow{margin:0 0 10px;font-size:15px;font-weight:700}.eyebrow a{color:#fff}
h1{font-family:var(--head);font-size:clamp(2.2rem,5.5vw,3.6rem);line-height:.95;margin:0 0 14px}
.sub{font-family:var(--body);max-width:700px;line-height:1.5;margin:0 0 20px}
.box{background:#fff;color:var(--navy);border-radius:14px;padding:22px;box-shadow:0 20px 40px rgba(0,0,0,.35)}
[hidden]{display:none!important}
button{font-family:var(--ui);cursor:pointer}
input[type=search]{width:100%;padding:12px 14px;font:inherit;font-size:16px;color:var(--navy);background:#fff;border:2px solid var(--line);border-radius:8px}
button:focus-visible,summary:focus-visible,a:focus-visible,input:focus-visible,tr:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 4px}
.bar .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;opacity:.6;min-width:4.2em}
.pill{border:2px solid var(--line);background:#fff;color:var(--navy);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:700}
.pill small{font-weight:400;opacity:.75}
.pill[aria-pressed=true]{background:var(--bblue);border-color:var(--bblue);color:#fff}
.sp{flex:1}
.lnk{border:0;background:none;color:var(--purple);font-weight:700;font-size:13px;padding:6px 4px}
.count{font-size:13px;margin:6px 0 0;opacity:.8}
h2{font-family:var(--head);font-size:1.5rem;margin:22px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--purple)}
details.course{border-bottom:1px solid var(--line)}
details.course>summary{display:flex;gap:12px;align-items:baseline;padding:11px 6px;cursor:pointer;list-style:none}
details.course>summary::-webkit-details-marker{display:none}
details.course>summary::before{content:"▸";color:var(--purple);flex:none;transition:transform .15s}
details.course[open]>summary::before{transform:rotate(90deg)}
details.course>summary:hover{background:#f3f1ff}
.cd{font-weight:700;color:var(--purple);flex:none;min-width:6.2em}
.tt{flex:1}
.n{font-size:12px;opacity:.65;flex:none;text-align:right}
.tags{display:flex;gap:4px;flex-wrap:wrap;flex:none}
.tag{font-size:11px;font-weight:700;padding:1px 8px;border-radius:10px;background:#eeecfb;color:#4B3BB0;border:1px solid #c9c3f3;white-space:nowrap}
.tag.warn,.old{font-size:11px;font-weight:700;background:#fff4e5;color:#7a3b00;border:1px solid #f0c27b;border-radius:10px;padding:1px 8px;white-space:nowrap}
.body{padding:4px 8px 18px 30px}
mark{background:#ffe38a;color:inherit;border-radius:2px;padding:0 1px}
.none{padding:18px 4px}
.empty{font-size:13px;background:#fff4e5;border:1px solid #f0c27b;border-radius:8px;padding:8px 12px;color:#5a3600;margin:8px 0}
.foot{font-size:12px;line-height:1.5;opacity:.75;margin:20px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.relock{border:0;background:none;color:#fff;opacity:.8;font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:0;margin-left:10px}
#wait{opacity:.8}
@media(max-width:640px){body{padding:16px}.box{padding:14px}details.course>summary{flex-wrap:wrap}.cd{min-width:0}.n{width:100%;text-align:left;padding-left:20px}.body{padding-left:6px}}

.wrap{max-width:920px}
.tag.mj{background:#140f50;color:#fff;border-color:#140f50}.tag.core{background:#F8EFE0;color:#140f50;border-color:#a8915c}
.ver{font-size:12px;margin:4px 0 6px;opacity:.75}
.mod{margin:14px 0 4px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--purple)}
.mod b{color:var(--navy);font-size:15px;text-transform:none;letter-spacing:0;margin-left:6px}
.mod.loose,.mod.loose b{color:#7a3b00}
ol.topics{margin:0;padding:0;list-style:none}
ol.topics>li{padding:6px 0;border-top:1px solid #eeecf8;font-family:var(--body);line-height:1.45}
ol.topics>li:first-child{border-top:0}ol.topics>li.hl{background:#fff1cc}
.tp{display:flex;gap:10px;align-items:baseline}
.tn{font-family:var(--ui);font-size:11px;font-weight:700;opacity:.55;flex:none;min-width:4.6em;text-transform:uppercase}
.also{display:block;font-size:12px;font-style:italic;opacity:.65}
.tp .meta{font-family:var(--ui);font-size:11px;opacity:.6;margin-left:auto;flex:none;white-space:nowrap}
.cl{flex:none;font-family:var(--ui)}
.chip{display:inline-block;min-width:22px;text-align:center;font-size:11px;font-weight:700;padding:1px 6px;margin:0 0 0 2px;border-radius:10px;background:var(--purple);color:#fff;border:0}
.chip.on{background:var(--amber);color:var(--navy)}
.noclo{font-size:11px;opacity:.45;font-style:italic}
.clos{margin:16px 0 0}.clos h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--purple);margin:0 0 6px}
ol.cll{list-style:none;margin:0;padding:0}
ol.cll li{display:grid;grid-template-columns:4.2em 1fr auto;gap:8px;align-items:baseline;padding:5px 8px;border-radius:8px;font-family:var(--body);font-size:14px;line-height:1.4;cursor:pointer}
ol.cll li b{font-family:var(--ui);color:var(--purple);font-size:13px}
ol.cll li .w{font-family:var(--ui);font-size:12px;opacity:.75;white-space:nowrap}
ol.cll li.none .w{color:#7a3b00;opacity:1;font-weight:700}ol.cll li.on{background:#fff1cc}
@media(max-width:600px){.tp{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="wrap">
<p class="eyebrow"><a href="../">Staff area</a> · Bachelor of Mathematics &amp; Bachelor of Mathematics (Honours) CurV-data hub<button class="relock" id="lockbtn" hidden>Lock</button></p>

<h1>Modules and topics</h1>
<p class="sub">The modules and topics of each course as recorded in CurV, with the week and the CLOs each topic is mapped to. Click a CLO number to see which topics cover it.</p>
<p id="wait" role="status">Unlocking…</p>
<div class="box" id="app" hidden>
<input id="q" type="search" placeholder="Search courses, modules and topics" aria-label="Search" autocomplete="off">
<div class="bar" id="lv" role="group" aria-label="Level"></div>
<div class="bar" id="mj" role="group" aria-label="Major"></div>
<div class="bar"><span class="count" id="count" aria-live="polite"></span><span class="sp"></span><button class="lnk" id="ex">Expand all</button><button class="lnk" id="co">Collapse all</button></div>
<div id="list"></div>
<p class="foot" id="foot"></p>
</div>
</div>
<script src="../gate.js"></script>
<script>
// shared helpers for every page (inlined by the builder)
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const GN={1:'Level 1',2:'Level 2',3:'Level 3',4:'Level 4',5:'Level 5+ / postgraduate'};
const lvlGroup=l=>Math.min(Math.max(+l||0,1),5);
function hlr(toks){if(!toks.length)return t=>esc(t);const re=new RegExp('('+toks.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
 return t=>String(t??'').split(re).map((p,i)=>i%2?`<mark>${esc(p)}</mark>`:esc(p)).join('')}
const getJSON=u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u+' not found (HTTP '+r.status+')');return r.json()});
function loadFail(e){const w=$('wait')||$('list');if(w)w.textContent='Could not load the data: '+(e&&e.message||e)+(location.protocol==='file:'?'. Pages read their data from the website, so open this from the website (or a local web server), not as a file.':'')}

// open this page's encrypted data, then call app(data)
function unlockThen(name, app) {
  Staff.open('data.enc.json').then(files => {
    const f = files[name]; if (!f) throw new Error('the encrypted file has no ' + name);
    $('lockbtn').hidden = false; $('lockbtn').onclick = () => Staff.lock();
    $('wait').hidden = true; $('app').hidden = false;
    app(JSON.parse(f));
  }).catch(e => { $('wait').textContent = 'Could not open the page: ' + (e.message || e); });
}

let C=[],D,lvl='all',maj='all',toks=[],hl=hlr([]);
unlockThen('topics.json',d=>{D=d;
 C=d.courses.map(c=>{const inner=c.modules.flatMap(m=>[m.loose?'':m.m,...m.topics.map(t=>t.t)]).join(' ').toLowerCase();
  const nT=c.modules.reduce((n,m)=>n+m.topics.length,0),nM=c.modules.filter(m=>!m.loose).length;
  const per={};for(const m of c.modules)for(const t of m.topics)for(const n of t.clos)(per[n]=per[n]||[]).push(t.n);
  return{...c,g:lvlGroup(c.level),inner,hay:(c.code+' '+c.title+' '+inner).toLowerCase(),nT,nM,per}});
 const pills=(el,lbl,items)=>{$(el).innerHTML=`<span class="lbl">${lbl}</span>`+items.map(([k,l])=>`<button class="pill" data-k="${esc(k)}" aria-pressed="${k==='all'}">${esc(l)}</button>`).join('')};
 pills('lv','Level',[['all','All levels'],...[...new Set(C.map(c=>c.g))].sort().map(g=>[g,GN[g]])]);
 if(d.majors.length)pills('mj','Major',[['all','All'],...d.majors.map(m=>[m.code,m.name])]);else $('mj').hidden=true;
 $('foot').textContent=`Exported from CurV on ${d.exportedText} (${d.year} versions). Choosing a major shows its courses plus the program's core courses.${d.missing.length?' No topics in CurV: '+d.missing.join(', ')+'.':''}`;
 draw();const id=location.hash.slice(1),el=id&&document.getElementById('c-'+id);if(el){el.open=true;el.scrollIntoView()}});
const inMajor=c=>maj==='all'||c.tags.some(t=>t.k===maj||t.k==='core');
function chips(c,list){if(!list.length)return'<span class="noclo">no CLO</span>';return list.map(n=>{const x=c.clos.find(y=>y.no===n);return`<button class="chip" data-clo="${esc(n)}" title="CLO ${esc(n)}${x?': '+esc(x.text):''}">${esc(n)}</button>`}).join('')}
function body(c){let h=`<div class="ver">CurV ${esc(c.version)}, applies ${esc(c.applies)}${c.old?` · <b>not the ${esc(D.year)} version</b>`:''}</div>`;
 if(!c.modules.length)return h+'<p class="empty">No modules or topics recorded in CurV.</p>';
 for(const m of c.modules){h+=m.loose?`<div class="mod loose"><b>${esc(m.m)}</b></div>`:`<div class="mod">Module ${esc(m.n)}<b>${hl(m.m)}</b></div>`;
  h+='<ol class="topics">'+m.topics.map(t=>`<li data-clos="${esc(t.clos.join(' '))}"><div class="tp"><span class="tn">Topic ${esc(t.n)}</span><span>${hl(t.t)}${t.also?`<span class="also">also in ${esc(t.also.join('; '))}</span>`:''}</span><span class="meta">${t.week?'Week '+esc(t.week):''}</span><span class="cl">${chips(c,t.clos)}</span></div></li>`).join('')+'</ol>'}
 if(c.clos.length)h+=`<div class="clos"><h3>Course learning outcomes and the topics that cover them</h3><ol class="cll">${c.clos.map(x=>{const ts=c.per[x.no]||[];
  return`<li data-clo="${esc(x.no)}" class="${ts.length?'':'none'}"><b>CLO ${esc(x.no)}</b><span>${esc(x.text)}</span><span class="w">${ts.length?(ts.length===1?'Topic ':'Topics ')+ts.join(', '):'No topics'}</span></li>`}).join('')}</ol></div>`;
 return h}
function draw(){const hit=C.filter(c=>(lvl==='all'||c.g==lvl)&&inMajor(c)&&toks.every(t=>c.hay.includes(t)));
 $('count').textContent=`Showing ${hit.length} of ${C.length} courses`;
 if(!hit.length){$('list').innerHTML='<p class="none">No courses match.</p>';return}
 let h='',g=0;for(const c of hit){if(c.g!==g){g=c.g;h+=`<h2>${GN[g]}</h2>`}
  const open=toks.length&&hit.length<=8&&toks.some(t=>c.inner.includes(t));
  const tags=c.tags.map(t=>`<span class="tag ${t.k==='core'?'core':'mj'}">${esc(t.label)}</span>`).join('')+(c.old?'<span class="tag warn">Old version</span>':'');
  h+=`<details class="course" id="c-${esc(c.code)}"${open?' open':''}><summary><span class="cd">${hl(c.code)}</span><span class="tt">${hl(c.title)}</span><span class="tags">${tags}</span><span class="n">${c.nM} module${c.nM===1?'':'s'} · ${c.nT} topic${c.nT===1?'':'s'}</span></summary><div class="body">${body(c)}</div></details>`}
 $('list').innerHTML=h}
$('q').addEventListener('input',e=>{toks=e.target.value.toLowerCase().split(/\s+/).filter(Boolean);hl=hlr(toks);draw()});
for(const [id,set] of [['lv',k=>lvl=k],['mj',k=>maj=k]])$(id).addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;set(b.dataset.k);$(id).querySelectorAll('.pill').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()});
$('ex').onclick=()=>document.querySelectorAll('#list details').forEach(d=>d.open=true);
$('co').onclick=()=>document.querySelectorAll('#list details').forEach(d=>d.open=false);
$('list').addEventListener('click',e=>{const el=e.target.closest('.chip,ol.cll li');if(!el)return;
 const b=el.closest('.body'),n=el.dataset.clo,was=b.dataset.sel===n;b.dataset.sel=was?'':n;
 b.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',!was&&x.dataset.clo===n));
 b.querySelectorAll('ol.cll li').forEach(x=>x.classList.toggle('on',!was&&x.dataset.clo===n));
 b.querySelectorAll('ol.topics>li').forEach(x=>x.classList.toggle('hl',!was&&x.dataset.clos.split(' ').includes(n)))});
</script>
</body>
</html>
