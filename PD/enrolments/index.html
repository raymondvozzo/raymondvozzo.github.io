<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class enrolments</title>
<style>
:root{--navy:#140f50;--purple:#6E5AE1;--line:#d9d6ee;--ui:Arial,Helvetica,sans-serif;--body:Georgia,"Roboto Serif",Cambria,serif;--head:"National 2 Condensed","National 2","Arial Narrow","Roboto Condensed",Arial,sans-serif;--ok:#1f9d55;--mid:#e49b0f;--hi:#d64545}
*{box-sizing:border-box}
body{font-family:var(--ui);margin:0;padding:28px;background:var(--navy);color:#fff;min-height:100vh}
.wrap{max-width:900px;margin:0 auto}
.eyebrow{margin:0 0 10px;font-size:15px;font-weight:700}.eyebrow a{color:#fff}
h1{font-family:var(--head);font-size:clamp(2.2rem,5.5vw,3.6rem);line-height:.95;margin:0 0 14px}
.sub{font-family:var(--body);max-width:640px;line-height:1.5;margin:0 0 20px}
.box{background:#fff;color:var(--navy);border-radius:14px;padding:22px;box-shadow:0 20px 40px rgba(0,0,0,.35)}
.bar-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
input[type=search],select{font:inherit;font-size:14px;padding:8px 10px;border:1px solid #c9c6e0;border-radius:6px;color:var(--navy);background:#fff}
input[type=search]{flex:1;min-width:200px}
.upd{font-size:12px;opacity:.75;margin:0 0 8px}
button{font-family:var(--ui);cursor:pointer}
.btn{font-size:12px;padding:5px 10px;border-radius:6px;border:1px solid var(--purple);background:#fff;color:var(--purple);font-weight:700}
.btn:hover{background:#f1efff}.btn:disabled{opacity:.5;cursor:wait}
button:focus-visible,summary:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
details.course{border-bottom:1px solid var(--line)}
summary{display:flex;gap:12px;align-items:center;padding:12px 6px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";color:var(--purple);flex:none;transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
summary:hover{background:#f3f1ff}
.cc{font-weight:700;color:var(--purple);flex:none}.cn{font-weight:700}
.segs{margin-left:auto;display:flex;flex-direction:column;gap:3px;flex:none}
.seg{display:grid;grid-template-columns:66px 80px 62px 72px;gap:8px;align-items:center;font-size:11px;white-space:nowrap}
.seg .mini{width:100%}.seg b{font-weight:700}.seg .n2{text-align:right;font-variant-numeric:tabular-nums;opacity:.85}
.spark{display:block;width:72px;height:20px;padding:0;margin:0;border:0;background:none;color:var(--c,var(--purple));cursor:pointer;border-radius:4px}
.spark:hover{background:#f1efff}.spark svg{display:block}
.nospark{font-size:10px;opacity:.5;text-align:center}
dialog{width:min(720px,96vw);max-height:92vh;overflow:auto;padding:20px;border:0;border-radius:12px;background:#fff;color:var(--navy);font-family:var(--body);font-size:14px;line-height:1.45}
dialog::backdrop{background:rgba(10,8,40,.6)}
dialog h3{font-family:var(--head);font-size:1.6rem;line-height:1;margin:0 0 4px;border:0}.dx{position:absolute;top:8px;right:12px;background:none;border:0;font-size:26px;color:var(--navy);cursor:pointer}
.ch{width:100%;height:auto;display:block;font-family:var(--ui);touch-action:none}
.ch .gl{stroke:#e2dff3;stroke-width:1}.ch text{fill:var(--navy);font-size:10px;opacity:.75}
.ch .cap{fill:none;stroke:#9a96bd;stroke-width:1.5;stroke-dasharray:4 3}.ch .ln{fill:none;stroke:var(--purple);stroke-width:2.5;stroke-linejoin:round}
.ch .ly{stroke:#B5338A;stroke-width:1.5;stroke-dasharray:6 3}.ch .vl{stroke:var(--navy);stroke-width:1;stroke-dasharray:2 3;opacity:.6}
.ch .fut{fill:#f3f1ff}.ch .dot{fill:var(--purple);stroke:#fff;stroke-width:2}.ch .xh{stroke:var(--navy);stroke-width:1;opacity:.35}
.rd{font-family:var(--ui);font-size:13px;min-height:1.4em;margin:2px 0 8px}
.dl{font-family:var(--ui);font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:10px 0}.dl dt{font-weight:700}.dl dd{margin:0}
.lg{font-family:var(--ui);font-size:12px;display:flex;flex-wrap:wrap;gap:14px;margin:6px 0}.lg i{display:inline-block;width:22px;height:0;border-top:3px solid var(--purple);vertical-align:middle;margin-right:6px}
.lg .a i{border-top:2px dashed #9a96bd}.lg .b i{border-top:2px dashed #B5338A}
.note{font-family:var(--ui);font-size:12px;background:#f3f1ff;border-radius:8px;padding:8px 12px;margin:10px 0 0}
.nodata{font-size:12px;opacity:.6}
.mini{width:70px;height:8px;border-radius:4px;background:#e6e3f5;overflow:hidden;flex:none}
.mini i,.bar i{display:block;height:100%;background:var(--c,var(--ok));width:var(--w,0%)}
.body{padding:4px 6px 16px 30px}
.cm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:12px;margin:2px 0 8px}
.cm a{color:var(--purple);font-weight:700}
h3{font-family:var(--head);font-size:1.4rem;margin:14px 0 2px;border-bottom:2px solid var(--purple)}
.kd{font-size:12px;opacity:.8;margin:4px 0}
h4{font-size:13px;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em;opacity:.7}
.cl{display:grid;grid-template-columns:150px 1fr 110px;gap:10px;align-items:center;padding:6px 8px;border-radius:6px;font-size:13px}
.cl:nth-child(odd){background:#f7f6fd}
.cl .k{font-weight:700}.cl .k small{display:block;font-weight:400;opacity:.7}
.cl .k a{color:var(--navy)}
.bar{height:14px;border-radius:7px;background:#e6e3f5;overflow:hidden}
.num{text-align:right;font-variant-numeric:tabular-nums}
.when{grid-column:2/4;font-size:11px;opacity:.7;margin-top:-4px}
.msg{padding:14px 4px}.err{color:#9c3d00}
.legend{font-size:12px;display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 12px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:5px}
@media(max-width:600px){summary{flex-wrap:wrap}.segs{margin-left:30px;width:100%}body{padding:16px}.box{padding:14px}.cl{grid-template-columns:1fr 90px}.cl .bar{grid-column:1/3;grid-row:2}.body{padding-left:8px}.when{grid-column:1/3}}
</style>
</head>
<body>
<div class="wrap">
<p class="eyebrow"><a href="../">PD Resources</a> · School of Mathematical Sciences · Adelaide University</p>
<h1>Class enrolments</h1>
<p class="sub">How full each class is. The numbers are collected from the university's course pages every hour, so they can be a little behind. Open a course to see its classes.</p>
<div class="box">
  <div class="bar-top">
    <input type="search" id="q" placeholder="Search by course code or name" aria-label="Search courses">
    <select id="lvl" aria-label="Level"><option value="">All levels</option><option>1</option><option>2</option><option>3</option><option>4</option></select>
    <button class="btn" id="reload">Reload saved data</button>
  </div>
  <p class="upd" id="upd"></p>
  <div class="legend"><span style="--c:var(--ok)">under 75% full</span><span style="--c:var(--mid)">75–99% full</span><span style="--c:var(--hi)">full</span></div>
  <div id="out"><p class="msg">Loading…</p></div>
</div>
</div>
<dialog id="dlg"></dialog>
<script>
// ---- settings you may want to change -------------------------------------------------
// Class pages on the university system look like
//   ClassStudentDetails.aspx?ciid=2720_MATH_1004_1&clid=27209&csmn=1
// where 27 = year, 20 = Semester 1 (50 = Semester 2), MATH_1004 = course, the last digit is the first semester the course runs,
// and clid is the class number. Only Semester 1 and 2 are known; other terms show the class as plain text.
const CLASS_BASE = 'https://apps.adelaide.edu.au/Staff/Teaching/Courses/ClassStudentDetails.aspx';
const TERM_CODE = {1:'20', 2:'50'};
const DASH_BASE = 'https://apps.adelaide.edu.au/Staff/Teaching/Courses/Dashboard.aspx';
// The last digit of the code identifies the course on a campus (it is not the semester). It is kept in
// ciid-suffix.csv, one row per course and campus.
let SUF={};
const sufFor=(code,campus)=>(SUF[code]||{})[String(campus||'').trim().toLowerCase()]||'';
function ciid(code, term, suf){
  const sem = (/^semester\s*([12])\b/i.exec(term||'')||[])[1], m = /^([A-Z]{4})(.+)$/.exec(code||'');
  const yr = String(DATA.meta&&DATA.meta.year||'').slice(-2);
  return sem&&m&&suf&&yr.length===2 ? yr+TERM_CODE[sem]+'_'+m[1]+'_'+m[2]+'_'+suf : '';
}
function classUrl(code, term, campus, k){
  const id = ciid(code, term, sufFor(code,campus));
  return id&&k.number ? CLASS_BASE+'?ciid='+id+'&clid='+encodeURIComponent(k.number)+'&csmn=1' : '';
}
function dashLinks(code, c){
  const a=(id,label)=>`<a href="${esc(DASH_BASE+'?ciid='+id)}" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">${label}</a>`;
  const combos=[];
  for(const t of c.terms||[])for(const cp of t.campuses)if(ciid(code,t.name,'1'))combos.push({t:t.name,cp:cp.name,suf:sufFor(code,cp.name)});
  const nt=new Set(combos.map(x=>x.t)).size, nc=new Set(combos.map(x=>x.cp)).size;
  const known=combos.filter(x=>x.suf), unknown=combos.filter(x=>!x.suf);
  let h=known.map(x=>{const p=[nt>1?x.t:'',nc>1?x.cp:''].filter(Boolean).join(', ');return a(ciid(code,x.t,x.suf),'Dashboard'+(p?' ('+esc(p)+')':''))}).join('');
  if(unknown.length){const x=unknown[0];   // not in ciid-suffix.csv yet: offer both digits so you can see which one works
    h+=`<span>Dashboard, not checked yet${nc>1?' ('+esc(x.cp)+')':''}: ${a(ciid(code,x.t,'1'),'try 1')} ${a(ciid(code,x.t,'2'),'try 2')}</span>`}
  return h;
}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let CSV=[], DATA={meta:{},courses:{}}, HIST={}, LY={year:null,courses:{}};
function parseCSV(t){const rows=[];let r=[],f='',q=false;t=t.replace(/^﻿/,'');
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;else if(c==','){r.push(f);f=''}
    else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);rows.push(r);r=[];f=''}
    else f+=c}
  if(f||r.length){r.push(f);rows.push(r)}return rows.filter(r=>r.some(x=>x.trim()))}
const ago=iso=>{if(!iso)return'never';const m=Math.round((Date.now()-new Date(iso))/60000);
  if(m<1)return'just now';if(m<60)return m+' min ago';const h=Math.round(m/60);if(h<48)return h+' h ago';return Math.round(h/24)+' days ago'};
const fmt=iso=>iso?new Date(iso).toLocaleString([], {dateStyle:'medium',timeStyle:'short'}):'never';
const colour=p=>p>=100?'var(--hi)':p>=75?'var(--mid)':'var(--ok)';
function classes(c){const out=[];for(const t of c.terms||[])for(const cp of t.campuses)for(const g of cp.groups)for(const k of g.classes)out.push(k);return out}
function totals(c){let size=0,taken=0,n=0;for(const k of classes(c)){if(k.size==null||k.available==null)continue;n++;
  if(k.type==='Enrolment class'){size+=k.size;taken+=k.size-k.available}}return{size,taken,n}}
const campAbbr=n=>({'adelaide city campus east':'CE','mawson lakes':'ML'}[String(n).trim().toLowerCase()]||String(n).replace(/\b(adelaide|campus)\b/ig,'').trim().split(/\s+/).map(w=>w[0]||'').join('').toUpperCase()||'?');
const termAbbr=n=>{const m=/^semester\s*(\d)/i.exec(n||'');return m?'Sem '+m[1]:String(n||'')};
// enrolment-class totals for each semester and campus
function segs(c){const out=[];for(const t of c.terms||[])for(const cp of t.campuses){let size=0,taken=0,n=0;
  for(const g of cp.groups)for(const k of g.classes)if(k.type==='Enrolment class'&&k.size!=null&&k.available!=null){size+=k.size;taken+=k.size-k.available;n++}
  if(n)out.push({label:termAbbr(t.name)+' · '+campAbbr(cp.name),title:t.name+', '+cp.name,size,taken,code:c.code,term:t.name,campus:cp.name})}return out.sort((a,b)=>a.label.localeCompare(b.label))}
// ---- history: enrolled number of a semester+campus over time (sum of its enrolment classes) ----
function series(code,term,campus){
  const c=DATA.courses[code],t=c&&(c.terms||[]).find(x=>x.name===term),cp=t&&t.campuses.find(x=>x.name===campus);if(!cp)return null;
  const arrs=[];for(const g of cp.groups)for(const k of g.classes)if(k.type==='Enrolment class'&&k.number){const a=HIST[code+'|'+k.number];if(a&&a.length)arrs.push(a)}
  if(!arrs.length)return null;
  const t0=Math.max(...arrs.map(a=>a[0][0]));
  const times=[...new Set(arrs.flatMap(a=>a.map(p=>p[0])).filter(x=>x>=t0).concat([t0]))].sort((a,b)=>a-b);
  const pts=times.map(tm=>{let taken=0,size=0;for(const a of arrs){let v=a[0];for(const p of a){if(p[0]<=tm)v=p;else break}taken+=v[1];size+=v[2]}return{t:tm*1000,taken,size}});
  const end=Math.max(pts[pts.length-1].t,Date.parse(DATA.meta&&DATA.meta.generated)||0);
  if(end>pts[pts.length-1].t)pts.push({...pts[pts.length-1],t:end});
  return pts}
const stepPath=(pts,X,Y,key)=>pts.map((p,i)=>(i?`H${X(p.t).toFixed(1)}V${Y(p[key]).toFixed(1)}`:`M${X(p.t).toFixed(1)} ${Y(p[key]).toFixed(1)}`)).join('');
function sparkHtml(x){
  const pts=series(x.code,x.term,x.campus),key=esc([x.code,x.term,x.campus].join('|'));
  if(!pts||pts.length<2||pts[pts.length-1].t-pts[0].t<2*3600e3)return`<span class="nospark" title="History is being collected: a line appears once the numbers have changed over a few hours">collecting</span>`;
  const W=72,H=20,m=2,t0=pts[0].t,t1=pts[pts.length-1].t,ym=Math.max(1,...pts.map(p=>Math.max(p.taken,p.size)));
  const X=t=>m+(W-2*m)*(t-t0)/(t1-t0||1),Y=v=>H-m-(H-2*m)*v/ym,p=x.size?Math.round(100*x.taken/x.size):0;
  return`<button class="spark" data-h="${key}" style="--c:${colour(p)}" title="Enrolment over time: click for a bigger chart" aria-label="Enrolment over time for ${esc(x.title)}: open chart"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><path d="${stepPath(pts,X,Y,'size')}" fill="none" stroke="#b9b5d6" stroke-width="1" stroke-dasharray="2 2"/><path d="${stepPath(pts,X,Y,'taken')}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>`}
function kdate(s){const m=/(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s||'');return m?new Date(+m[3],+m[2]-1,+m[1]).getTime():null}
const dshort=t=>new Date(t).toLocaleDateString([], {day:'numeric',month:'short'});
const dlong=t=>new Date(t).toLocaleString([], {weekday:'short',day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'});
function openChart(key,full){
  const [code,term,campus]=key.split('|'),pts=series(code,term,campus);if(!pts)return;
  const c=DATA.courses[code],tm=(c.terms||[]).find(x=>x.name===term),kd=(tm&&tm.keyDates)||{},eb=kdate(kd.enrol),cs=kdate(kd.census);
  const ly=((LY.courses||{})[code]||{})[term+'|'+campus];
  const cur=pts[pts.length-1],t0=pts[0].t,now=cur.t;
  const target=Math.max(eb||0,cs||0);
  if(full===undefined)full=!!target&&(target-t0)<=4*(now-t0)+21*86400e3;   // long, empty stretch ahead: start with the data so far
  const tEnd=full&&target?Math.max(now+86400e3,target):now+Math.max(2*86400e3,.08*(now-t0));
  const ymax=Math.max(1,cur.size,...pts.map(p=>Math.max(p.taken,p.size)),ly?ly.taken:0)*1.1;
  const W=680,H=300,L=44,R=16,T=14,B=30,X=t=>L+(W-L-R)*(t-t0)/((tEnd-t0)||1),Y=v=>T+(H-T-B)*(1-v/ymax);
  const ticks=[];const step=Math.pow(10,Math.floor(Math.log10(ymax/4)));let st=step;for(const k of[1,2,2.5,5,10])if(ymax/(step*k)<=5){st=step*k;break}
  for(let v=0;v<=ymax;v+=st)ticks.push(v);
  const xt=[0,1,2,3,4].map(i=>t0+(tEnd-t0)*i/4),dtick=t=>(tEnd-t0)<4*86400e3?new Date(t).toLocaleString([], {day:'numeric',month:'short',hour:'numeric'}):dshort(t);
  const p=cur.size?Math.round(100*cur.taken/cur.size):0;
  let svg=`<svg class="ch" id="chsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Enrolment over time for ${esc(code)}, ${esc(term)}, ${esc(campus)}">`;
  svg+=`<rect class="fut" x="${X(now)}" y="${T}" width="${Math.max(0,W-R-X(now))}" height="${H-T-B}"/>`;
  svg+=ticks.map(v=>`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+3}" text-anchor="end">${v}</text>`).join('');
  svg+=xt.map(t=>`<text x="${X(t)}" y="${H-10}" text-anchor="middle">${dtick(t)}</text>`).join('');
  if(ly)svg+=`<line class="ly" x1="${L}" x2="${W-R}" y1="${Y(ly.taken)}" y2="${Y(ly.taken)}"/><text x="${W-R-2}" y="${Y(ly.taken)-4}" text-anchor="end" style="fill:#B5338A;opacity:1">${esc(LY.year||'Last year')} final: ${ly.taken}</text>`;
  for(const [t,l] of [[eb,'Enrol by'],[cs,'Census']])if(t&&t>=t0&&t<=tEnd)svg+=`<line class="vl" x1="${X(t)}" x2="${X(t)}" y1="${T}" y2="${H-B}"/><text x="${X(t)-3}" y="${T+10}" text-anchor="end">${l}</text>`;
  svg+=`<path class="cap" d="${stepPath(pts,X,Y,'size')}"/><path class="ln" d="${stepPath(pts,X,Y,'taken')}"/><circle class="dot" cx="${X(now)}" cy="${Y(cur.taken)}" r="4.5"/>`;
  svg+=`<text x="${X(now)+(X(now)>W-120?-8:8)}" y="${H-B-8}" text-anchor="${X(now)>W-120?'end':'start'}" style="opacity:.55">forecast: not available yet</text>`;
  svg+=`<line class="xh" id="xh" y1="${T}" y2="${H-B}" x1="-10" x2="-10"/></svg>`;
  const days=t=>{const d=Math.round((t-Date.now())/86400e3);return d>0?`in ${d} day${d==1?'':'s'}`:d==0?'today':`${-d} day${d==-1?'':'s'} ago`};
  $('dlg').innerHTML=`<button class="dx" aria-label="Close" id="dx">×</button><h3>${esc(code)} <span style="color:var(--purple)">${esc(termAbbr(term))} · ${esc(campAbbr(campus))}</span></h3>
  <div style="font-family:var(--ui);font-size:12px;opacity:.75">${esc(c.name||(CSV.find(r=>r.code===code)||{}).name||'')} · ${esc(term)}, ${esc(campus)}</div>
  <div class="rd" id="rd" aria-live="polite">Move over the chart to read a value.</div>${svg}
  <div class="lg"><span><i></i>Enrolled</span><span class="a"><i></i>Class size (capacity)</span>${ly?`<span class="b"><i></i>${esc(LY.year||'Last year')} final</span>`:''}</div>
  ${target?`<button class="btn" id="vw">${full?'Zoom to the data so far':'Show up to the enrol-by date'}</button>`:''}
  <dl class="dl"><dt>Now</dt><dd>${cur.taken} of ${cur.size} (${p}% full)</dd>
  ${ly?`<dt>${esc(LY.year||'Last year')} final</dt><dd>${ly.taken} of ${ly.size}</dd>`:''}
  ${eb?`<dt>Enrol by</dt><dd>${new Date(eb).toLocaleDateString([], {weekday:'short',day:'numeric',month:'short',year:'numeric'})} (${days(eb)})</dd>`:''}
  ${cs?`<dt>Census</dt><dd>${new Date(cs).toLocaleDateString([], {weekday:'short',day:'numeric',month:'short',year:'numeric'})} (${days(cs)})</dd>`:''}
  <dt>History from</dt><dd>${dlong(t0)}</dd></dl>
  <p class="note">Forecast: not available yet. It needs a full enrolment period of recorded history to learn how numbers rise towards the enrol-by date. The numbers shown cannot rise above a class's size, so a full class hides how many more students wanted a place.</p>`;
  const dlg=$('dlg');if(!dlg.open)dlg.showModal();
  $('dx').onclick=()=>dlg.close();if($('vw'))$('vw').onclick=()=>openChart(key,!full);
  const sv=$('chsvg'),xh=$('xh'),rd=$('rd');
  const val=t=>{let v=pts[0];for(const q of pts){if(q.t<=t)v=q;else break}return v};
  const mv=e=>{const r=sv.getBoundingClientRect(),px=(e.clientX-r.left)*W/r.width,t=t0+(px-L)/(W-L-R)*(tEnd-t0);
    if(px<L||px>W-R){xh.setAttribute('x1',-10);xh.setAttribute('x2',-10);return}
    xh.setAttribute('x1',px);xh.setAttribute('x2',px);
    if(t>now){rd.textContent=dlong(t).replace(/,\s*\d+:\d+.*$/,'')+': after the latest data (no forecast yet)';return}
    const v=val(t);rd.textContent=dlong(Math.max(t,t0))+': '+v.taken+' enrolled of '+v.size}
  sv.addEventListener('mousemove',mv);sv.addEventListener('pointermove',mv);
}
function classHtml(k,code,term,campus){
  const has=k.size!=null&&k.available!=null, taken=has?k.size-k.available:0, p=has&&k.size?Math.round(100*taken/k.size):0;
  const name=esc(k.kind)+' '+esc(k.section);
  const u=classUrl(code,term,campus,k), link=u?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">${name}</a>`:name;
  const m=(k.meetings||[]).map(x=>[x.days,x.time,x.location||x.campus].filter(Boolean).join(' ')).filter(Boolean).join(' · ');
  return `<div class="cl"><div class="k">${link}<small>${k.type==='Enrolment class'?'Enrolment class':'Related class'} · #${esc(k.number)}</small></div>
  <div class="bar" role="img" aria-label="${p}% full"><i style="--w:${Math.min(p,100)}%;--c:${colour(p)}"></i></div>
  <div class="num">${has?`${taken} / ${k.size}<br><small>${k.available} left</small>`:'–'}</div>${m?`<div class="when">${esc(m)}</div>`:''}</div>`}
function courseBody(code){
  const c=DATA.courses[code];
  if(!c)return'<p class="msg">No data yet for this course. It will appear after the next update.</p>';
  let h=`<div class="cm"><span>Updated ${esc(ago(c.fetched))}</span><a href="${esc(c.url)}" target="_blank" rel="noopener">University course page</a>${dashLinks(code,c)}<button class="btn" data-r="${esc(code)}">Refresh this course</button></div>`;
  if(c.error)h+=`<p class="err">The last update failed (${esc(c.error)}). Showing the previous numbers.</p>`;
  if(c.status==='no-page')return h+'<p class="msg">There is no page for this course in the university system.</p>';
  if(c.status==='no-availability')return h+'<p class="msg">The course page has no availability section.</p>';
  if(!c.terms.length||c.status==='no-classes')return h+'<p class="msg">No classes are listed yet.</p>';
  for(const t of c.terms){h+=`<h3>${esc(t.name)}</h3>`;const kd=t.keyDates||{};
    const parts=[['enrol','Enrol by'],['census','Census'],['lastWF','Last day to withdraw (no fail)'],['lastW','Last day to withdraw']].filter(([k])=>kd[k]).map(([k,l])=>l+' '+kd[k]);
    if(parts.length)h+=`<p class="kd">${esc(parts.join(' · '))}</p>`;
    for(const cp of t.campuses)for(const g of cp.groups){h+=`<h4>${esc(cp.name)} · ${esc(g.name)}</h4>`+g.classes.map(k=>classHtml(k,code,t.name,cp.name)).join('')}}
  return h}
function render(){
  const q=$('q').value.trim().toLowerCase(), lv=$('lvl').value;
  const open=new Set([...document.querySelectorAll('details.course[open]')].map(d=>d.dataset.c));
  const rows=CSV.filter(r=>(!lv||String(r.level)===lv)&&(!q||(r.code+' '+r.name).toLowerCase().includes(q)));
  $('out').innerHTML=rows.length?rows.map(r=>{const c=DATA.courses[r.code],sg=c?segs(c):[];
    return `<details class="course" data-c="${esc(r.code)}"${open.has(r.code)||(q&&rows.length<=3)?' open':''}><summary><span class="cc">${esc(r.code)}</span><span class="cn">${esc(r.name)}</span>
    <span class="segs">${sg.length?sg.map(x=>{const p=x.size?Math.round(100*x.taken/x.size):0;return `<span class="seg" title="${esc(x.title)}: ${p}% full"><b>${esc(x.label)}</b><span class="mini"><i style="--w:${Math.min(p,100)}%;--c:${colour(p)}"></i></span><span class="n2">${x.taken} / ${x.size}</span>${sparkHtml(x)}</span>`}).join(''):'<span class="nodata">no data</span>'}</span></summary>
    <div class="body">${courseBody(r.code)}</div></details>`}).join(''):'<p class="msg">No courses match.</p>';
  $('upd').textContent=DATA.meta&&DATA.meta.generated?`Last updated ${fmt(DATA.meta.generated)} (${ago(DATA.meta.generated)}). The bars beside each course add up its enrolment classes (e.g. the forum) for each semester and campus (CE = Adelaide City Campus East, ML = Mawson Lakes). Related classes have their own bars inside. Click the small line beside a bar for the enrolment history.`:'No enrolment data has been collected yet. Run the "Update class enrolments" workflow once, or wait for the next hourly run.'}
async function load(){
  try{const [c,d]=await Promise.all([fetch('/prereqs/courses.csv',{cache:'no-store'}),fetch('data/enrolments.json?'+Date.now(),{cache:'no-store'})]);
    try{const sf=await fetch('ciid-suffix.csv?'+Date.now(),{cache:'no-store'});SUF={};if(sf.ok)for(const r of parseCSV(await sf.text()).slice(1)){const k=(r[0]||'').trim().toUpperCase().replace(/\s+/g,''),cp=(r[1]||'').trim().toLowerCase(),v=(r[2]||'').trim();if(k&&cp&&/^\d$/.test(v))(SUF[k]=SUF[k]||{})[cp]=v}}catch(_){SUF={}}
    if(!c.ok)throw new Error('Could not load prereqs/courses.csv');
    const rows=parseCSV(await c.text()),h=rows.shift().map(x=>x.trim().toLowerCase());
    const i=n=>h.indexOf(n);if(i('course code')<0||i('course name')<0)throw new Error('courses.csv is missing the "Course Code" or "Course Name" column');
    CSV=rows.map(r=>({code:r[i('course code')].trim(),name:r[i('course name')].trim(),level:r[i('level')]}));
    try{const ex=await fetch('extra-courses.csv?'+Date.now(),{cache:'no-store'});   // courses listed only on this page
      if(ex.ok){const er=parseCSV(await ex.text()),eh=er.shift().map(x=>x.trim().toLowerCase()),ei=n=>eh.indexOf(n);
        for(const r of er){const code=(r[ei('course code')]||'').trim().toUpperCase();
          if(code&&!CSV.some(x=>x.code===code))CSV.push({code,name:(r[ei('course name')]||'').trim(),level:(r[ei('level')]||'').trim()})}
        CSV=CSV.map((x,n)=>[x,n]).sort((a,b)=>(+a[0].level||9)-(+b[0].level||9)||a[1]-b[1]).map(x=>x[0])}}catch(_){}
    DATA=d.ok?await d.json():{meta:{},courses:{}};
    HIST={};try{const hr=await fetch('data/history.json?'+Date.now(),{cache:'no-store'});if(hr.ok)HIST=(await hr.json()).classes||{}}catch(_){}
    LY={year:null,courses:{}};try{const lr=await fetch('data/last-year.json?'+Date.now(),{cache:'no-store'});if(lr.ok)LY=await lr.json()}catch(_){}
    render()}
  catch(e){$('out').innerHTML='<p class="msg err">'+esc(e.message)+'</p>'}}
$('q').addEventListener('input',render);$('lvl').addEventListener('change',render);
$('reload').addEventListener('click',load);
$('out').addEventListener('click',e=>{const b=e.target.closest('[data-h]');if(!b)return;e.preventDefault();e.stopPropagation();openChart(b.dataset.h)});
$('out').addEventListener('click',async e=>{const b=e.target.closest('[data-r]');if(!b)return;e.preventDefault();
  const code=b.dataset.r;b.disabled=true;
  if(!REFRESH_URL){b.textContent='Reloading saved data…';await load();return}
  try{b.textContent='Requesting…';const r=await fetch(REFRESH_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({course:code})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    b.textContent='Updating (about a minute)…';const before=DATA.courses[code]&&DATA.courses[code].fetched;
    for(let n=0;n<12;n++){await new Promise(s=>setTimeout(s,10000));await load();
      const now=DATA.courses[code]&&DATA.courses[code].fetched;if(now&&now!==before)break}
  }catch(err){alert('Could not start the refresh: '+err.message)}
  await load()});
load();
</script>
